import java.util.Locale
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

apply plugin: 'base'

// Native platforms bundled into the receiver fat jar (opencv/openblas via javacv).
// Default: Windows + Apple-silicon macOS only. Build other/all platforms with
//   -PjavacppPlatform=linux-x86_64,windows-x86_64,...   (explicit list)
//   -PallPlatforms                                       (every supported platform)
ext.ALL_JAVACPP_PLATFORMS = [
        'android-arm', 'android-arm64', 'android-x86', 'android-x86_64',
        'ios-arm64', 'ios-x86_64',
        'linux-arm64', 'linux-armhf', 'linux-ppc64le', 'linux-x86', 'linux-x86_64',
        'macosx-arm64', 'macosx-x86_64',
        'windows-x86', 'windows-x86_64'
].join(',')
ext.DEFAULT_JAVACPP_PLATFORMS = 'windows-x86_64,macosx-arm64'

ext {
    picocliVersion = '4.7.6'
    zxingVersion = '3.5.2'
    junitJupiterVersion = '5.10.2'
    junitPlatformLauncherVersion = '1.10.2'
    javacvVersion = '1.5.10'
    opencvVersion = '4.9.0-1.5.10'
    openblasVersion = '0.3.26-1.5.10'
}

def senderJdbcVariantSuffix = {
    def queryJdbcDrivers = findProperty('queryJdbcDrivers')?.toString()?.trim()
    if (!queryJdbcDrivers || queryJdbcDrivers.equalsIgnoreCase('all')) {
        return ''
    }
    def suffix = queryJdbcDrivers.toLowerCase(Locale.ROOT)
            .replaceAll(/[^a-z0-9]+/, '-')
            .replaceAll(/^-|-$/, '')
    return suffix.isEmpty() ? '' : "-${suffix}"
}

def buildVersion = "0.95.${LocalDateTime.now().format(DateTimeFormatter.ofPattern('yyMMdd.HHmm', Locale.ROOT))}"
version = buildVersion

tasks.register('syncRootLibs', Sync) {
    into layout.buildDirectory.dir('libs')
}

tasks.register('syncGuiUserManual', Sync) {
    from layout.projectDirectory.dir('docs/gui-user-manual')
    into layout.buildDirectory.dir('gui-user-manual')
}

tasks.register('writeLauncherScripts') {
    dependsOn tasks.named('syncRootLibs')
    def libsDirProvider = layout.buildDirectory.dir('libs')
    def projectVersion = project.version.toString()
    outputs.dir(libsDirProvider)
    doLast {
        def libsDir = libsDirProvider.get().asFile
        libsDir.mkdirs()
        [
                encode : ['sender', 'encode'],
                slide  : ['sender', 'slide'],
                capture: ['receiver', 'capture'],
                decode : ['receiver', 'decode']
        ].each { name, command ->
            String app = command[0]
            String subcommand = command[1]
            String jarName = "${app}-${projectVersion}${app == 'sender' ? senderJdbcVariantSuffix() : ''}.jar"

            File sh = new File(libsDir, "${name}.sh")
            sh.text = """#!/usr/bin/env sh
set -eu
SCRIPT_DIR=\$(cd "\$(dirname "\$0")" && pwd)
exec java -jar "\$SCRIPT_DIR/${jarName}" ${subcommand} "\$@"
"""
            sh.setExecutable(true, false)

            File bat = new File(libsDir, "${name}.bat")
            bat.text = """@echo off\r
setlocal\r
set "SCRIPT_DIR=%~dp0"\r
java -jar "%SCRIPT_DIR%${jarName}" ${subcommand} %*\r
exit /b %ERRORLEVEL%\r
"""
        }
    }
}

tasks.register('printRootLibs') {
    dependsOn tasks.named('writeLauncherScripts')
    // Capture project state at configuration time so the doLast blocks never touch
    // Task.project at execution time (deprecated in Gradle 9, fails in Gradle 10;
    // also required for configuration-cache compatibility).
    def libsDirProvider = layout.buildDirectory.dir('libs')
    def bannerFile = rootProject.file('libs/common/src/main/resources/banner.txt')
    def projectVersion = project.version.toString()
    doLast {
        def libsDir = libsDirProvider.get().asFile
        println ''
        println 'Artifacts in build/libs:'
        if (!libsDir.exists()) {
            println '  (none)'
            return
        }

        def jarFiles = libsDir.listFiles()
                ?.findAll { it.isFile() }
                ?.sort { a, b -> a.name <=> b.name } ?: []

        if (jarFiles.isEmpty()) {
            println '  (none)'
            return
        }

        jarFiles.each { file ->
            def sizeMb = file.length() / (1024d * 1024d)
            println String.format(Locale.ROOT, '  %s (%.1f MB)', file.name, sizeMb)
        }
    }
    // Print the air-bridge banner once the build finishes. Reuses the same banner.txt the
    // runtime banner loads, so the build and the apps never drift. Runs regardless of whether
    // the artifact listing above returned early.
    doLast {
        if (!bannerFile.exists()) {
            return
        }
        def bannerText = bannerFile.getText('UTF-8')
        int width = bannerText.readLines().collect { it.length() }.max() ?: 0
        String footer = "air-bridge - ${projectVersion}"
        int pad = Math.max(0, width - footer.length())
        String footerLine = (' ' * pad) + footer
        println ''
        print bannerText
        println footerLine
    }
}

tasks.named('build') {
    dependsOn tasks.named('syncGuiUserManual')
    dependsOn tasks.named('writeLauncherScripts')
    finalizedBy tasks.named('printRootLibs')
}

subprojects {
    group = 'airbridge'
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    pluginManager.withPlugin('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformLauncherVersion}"
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.named('test') {
            useJUnitPlatform()
        }
    }

    plugins.withId('application') {
        tasks.named('jar') {
            dependsOn configurations.runtimeClasspath
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            archiveFileName = "${project.name}-${project.version}${project.name == 'sender' ? senderJdbcVariantSuffix() : ''}.jar"
            manifest {
                attributes(
                        'Manifest-Version': '1.0',
                        'Main-Class': application.mainClass.get(),
                        'Implementation-Title': project.name,
                        'Implementation-Version': project.version
                )
            }
            from {
                configurations.runtimeClasspath.collect {
                    it.isDirectory() ? it : zipTree(it)
                }
            } {
                exclude 'META-INF/MANIFEST.MF'
                exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            }
        }

        rootProject.tasks.named('syncRootLibs', Sync) {
            dependsOn tasks.named('jar')
            from(tasks.named('jar'))
        }
    }
}
