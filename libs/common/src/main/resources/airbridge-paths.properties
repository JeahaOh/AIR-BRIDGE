# Default working directory names, resolved relative to the application jar.
# Used when --in/--out are omitted (CLI) and as GUI field defaults.
#
# Default pipeline:
#   encode( source -> encoded ) -> slide( encoded ) -> capture( -> captured ) -> decode( captured -> decoded )
#
# To customize without rebuilding, place a file named "airbridge-paths.properties"
# next to the jar with the keys you want to override.
dir.source=source
dir.encoded=encoded
dir.captured=captured
dir.decoded=decoded
